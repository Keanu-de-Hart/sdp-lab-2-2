services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: guestbook
      POSTGRES_PASSWORD: guestbook
      POSTGRES_DB: guestbook
    volumes:
      - db-data:/var/lib/postgresql/data      # requirement 4: data survives down/up
    healthcheck:                              # requirement 5: "ready" means pg_isready passes
      test: ["CMD-SHELL", "pg_isready -U guestbook -d guestbook"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # no "ports:" here on purpose: the DB stays private (good-practice check)

  app:
    build: .                                  # requirement 1: built from your Dockerfile
    environment:
      DATABASE_URL: postgres://guestbook:guestbook@db:5432/guestbook   # requirement 2
      NODE_ENV: production
    ports:
      - "3000:3000"                           # requirement 3: host:container
    depends_on:
      db:
        condition: service_healthy            # requirement 5: wait until the DB is actually ready
    restart: unless-stopped

volumes:
  db-data: